name: Import verified repository support files

on:
  push:
    branches:
      - feature/five-domain-extension-split
    paths:
      - .github/workflows/import-repository-support.yml

permissions:
  contents: write

jobs:
  import-support:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/five-domain-extension-split
          fetch-depth: 0

      - name: Install Parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow==17.0.0

      - name: Download transfer dataset
        run: |
          curl --fail --location --retry 4 --retry-delay 3 \
            'https://titan-builder-ob009-artifact.miniup.app/api/data-file/titan-builder-ob009-artifact/workcore-repository-support-transfer.parquet' \
            --output /tmp/workcore-repository-support.parquet

      - name: Reconstruct and verify archive
        env:
          EXPECTED_SHA256: 921e62dbb1f7a4b940b2ba462e551bcdc4be59f7b1ae64fef6cb96f7432a985d
          EXPECTED_BYTES: '2120014'
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          import pyarrow.parquet as pq

          table = pq.read_table('/tmp/workcore-repository-support.parquet')
          rows = sorted(table.to_pylist(), key=lambda row: int(row['Sequence']))
          encoded = ''.join(str(row['Payload_Base64']) for row in rows)
          archive = base64.b64decode(encoded, validate=True)
          actual_sha = hashlib.sha256(archive).hexdigest()
          expected_sha = os.environ['EXPECTED_SHA256']
          expected_bytes = int(os.environ['EXPECTED_BYTES'])

          if len(archive) != expected_bytes:
              raise SystemExit(f'archive size mismatch: {len(archive)} != {expected_bytes}')
          if actual_sha != expected_sha:
              raise SystemExit(f'archive SHA-256 mismatch: {actual_sha} != {expected_sha}')

          Path('/tmp/workcore-repository-support.zip').write_bytes(archive)
          print(f'verified {len(archive)} bytes with SHA-256 {actual_sha}')
          PY

      - name: Expand support files
        run: |
          rm -rf /tmp/workcore-support-expanded
          mkdir -p /tmp/workcore-support-expanded
          unzip -q /tmp/workcore-repository-support.zip -d /tmp/workcore-support-expanded
          support=/tmp/workcore-support-expanded/workcore-repository-support
          test -f "$support/tools/build_extensions.py"
          test -f "$support/tests/test_build_extensions.py"
          test -d "$support/integration/host-overlay"
          cp "$support/tools/build_extensions.py" tools/build_extensions.py
          cp "$support/tests/test_build_extensions.py" tests/test_build_extensions.py
          cp -a "$support/docs" ./docs
          cp -a "$support/integration" ./integration
          cp -a "$support/site" ./site
          mkdir -p site/downloads
          cat > site/downloads/README.md <<'EOF'
          # Generated release downloads

          Release ZIPs are deterministic build outputs and are intentionally not committed here.
          Run `python tools/build_extensions.py` against the consolidated source to regenerate them.
          EOF

      - name: Remove one-shot importer
        run: rm -f .github/workflows/import-repository-support.yml

      - name: Verify imported support files
        run: |
          python -m unittest tests/test_repository_integrity.py -v
          python tools/validate_repository.py --repo .
          python -m py_compile tools/build_extensions.py tests/test_build_extensions.py

      - name: Commit support files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/build_extensions.py tests/test_build_extensions.py docs integration site .github/workflows/import-repository-support.yml
          git commit -m 'docs: add reproducible extraction tooling and host overlay'
          git push origin HEAD:feature/five-domain-extension-split
