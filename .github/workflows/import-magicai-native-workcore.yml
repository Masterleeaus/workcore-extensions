name: Import MagicAI-native WorkCore extensions

on:
  push:
    branches:
      - feature/magicai-native-workcore-extensions
    paths:
      - .github/workflows/import-magicai-native-workcore.yml

concurrency:
  group: import-magicai-native-workcore
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  import-native-extensions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out conversion branch
        uses: actions/checkout@v4
        with:
          ref: feature/magicai-native-workcore-extensions
          fetch-depth: 0

      - name: Install Parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow==17.0.0

      - name: Download verified publication transfer
        run: |
          curl --fail --location --retry 4 --retry-delay 3 \
            'https://titan-builder-ob009-artifact.miniup.app/api/data-file/titan-builder-ob009-artifact/workcore-native-extensions-publication-transfer.parquet' \
            --output /tmp/workcore-native-publication.parquet

      - name: Reconstruct and verify publication archive
        env:
          EXPECTED_SHA256: efeaa61609a5b8266f170d83e40faf5c808983e2f77650ddba3746ea71dc135a
          EXPECTED_BYTES: '2596669'
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          import pyarrow.parquet as pq

          rows = sorted(
              pq.read_table('/tmp/workcore-native-publication.parquet').to_pylist(),
              key=lambda row: int(row['Sequence']),
          )
          archive = base64.b64decode(
              ''.join(str(row['Payload_Base64']) for row in rows),
              validate=True,
          )
          actual_sha = hashlib.sha256(archive).hexdigest()
          expected_sha = os.environ['EXPECTED_SHA256']
          expected_bytes = int(os.environ['EXPECTED_BYTES'])
          if len(archive) != expected_bytes:
              raise SystemExit(f'archive size mismatch: {len(archive)} != {expected_bytes}')
          if actual_sha != expected_sha:
              raise SystemExit(f'archive SHA-256 mismatch: {actual_sha} != {expected_sha}')
          Path('/tmp/workcore-native-publication.zip').write_bytes(archive)
          print(f'verified {len(archive)} bytes with SHA-256 {actual_sha}')
          PY

      - name: Apply final source and native extension conversion
        run: |
          rm -rf /tmp/workcore-native-publication-expanded
          mkdir -p /tmp/workcore-native-publication-expanded
          unzip -q /tmp/workcore-native-publication.zip -d /tmp/workcore-native-publication-expanded
          source=/tmp/workcore-native-publication-expanded/workcore-native-publication

          test -f "$source/PUBLICATION-MANIFEST.json"
          test -f "$source/packages/workcore-commercial/src/Domains/WorkCore/System/Modules/Finance/Actions/CreateFinanceInvoice.php"
          test -f "$source/native-extensions/WorkCore/System/WorkCoreServiceProvider.php"
          test -f "$source/.github/workflows/magicai-native-laravel10.yml"

          rm -rf packages compatibility native-extensions integration/magicai-extension integration/magicai-10-fixture
          cp -a "$source/packages" ./packages
          cp -a "$source/compatibility" ./compatibility
          cp -a "$source/native-extensions" ./native-extensions
          cp -a "$source/integration/magicai-extension" ./integration/magicai-extension
          cp -a "$source/integration/magicai-10-fixture" ./integration/magicai-10-fixture
          cp "$source/ownership-manifest.json" ./ownership-manifest.json
          cp "$source/.gitignore" ./.gitignore
          cp "$source/PUBLICATION-MANIFEST.json" ./PUBLICATION-MANIFEST.json

          cp -a "$source/tools/." ./tools/
          cp -a "$source/tests/." ./tests/
          cp -a "$source/.github/workflows/." ./.github/workflows/
          cp -a "$source/docs/." ./docs/
          cp -a "$source/site/." ./site/
          cp -a "$source/integration/host-overlay/." ./integration/host-overlay/

          sed -i 's/EXPECTED_OWNED_FILE_COUNT = 2129/EXPECTED_OWNED_FILE_COUNT = 2158/' tools/validate_repository.py
          sed -i 's/self.assertEqual(2129, report.owned_file_count)/self.assertEqual(2158, report.owned_file_count)/' tests/test_repository_integrity.py

          cat > NATIVE-PUBLICATION.md <<'MD'
          # MagicAI-native publication provenance

          The final 2,158-file WorkCore source and six MagicAI-native extension wrappers were imported from a checksum-locked MiniUp transfer.

          - Dataset asset: `cb73687f-53bd-4a07-87e0-84f5ad0b8db6`
          - Dataset URL: `https://titan-builder-ob009-artifact.miniup.app/api/data-file/titan-builder-ob009-artifact/workcore-native-extensions-publication-transfer.parquet`
          - Publication archive bytes: `2,596,669`
          - Publication archive SHA-256: `efeaa61609a5b8266f170d83e40faf5c808983e2f77650ddba3746ea71dc135a`
          - Source files transported: `2,269`
          - Target branch: `feature/magicai-native-workcore-extensions`

          MiniUp is transport provenance only and is not a runtime dependency.
          MD

          rm -f .github/workflows/import-magicai-native-workcore.yml

      - name: Verify complete repository and native packages
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tools/validate_repository.py --repo .
          python tools/build_magicai_extensions.py --repo . --output dist/magicai-extensions
          python tools/validate_magicai_extensions.py \
            dist/magicai-extensions/WorkCore \
            dist/magicai-extensions/WorkCoreBusinessNetwork \
            dist/magicai-extensions/WorkCoreCommercial \
            dist/magicai-extensions/WorkCoreWorkOperations \
            dist/magicai-extensions/WorkCorePropertyOperations \
            dist/magicai-extensions/WorkCoreWorkforceAssurance
          test "$(find packages -type f -name '*.php' | wc -l)" -eq 2090
          find packages native-extensions integration/magicai-10-fixture dist/magicai-extensions \
            -type f -name '*.php' -print0 | xargs -0 -n1 -P4 php -l >/tmp/php-lint.txt
          grep -q 'CreateFinanceCreditNote.php' ownership-manifest.json
          grep -q '2026_08_02_000002_create_tm_payment_orchestration_tables.php' ownership-manifest.json

      - name: Run supplied WorkCore and Finance verification suites
        run: |
          host=$(mktemp -d)
          cp -a integration/host-overlay/. "$host/"
          mkdir -p "$host/app/Domains"
          cp -a dist/magicai-extensions/WorkCore/Runtime/Domains/WorkCore "$host/app/Domains/WorkCore"
          cp -a dist/magicai-extensions/WorkCore/docs/source/aggregate-providers/. "$host/app/Domains/WorkCore/Providers/"

          php "$host/tests/Standalone/WorkCoreExtraction/run.php"
          php "$host/tests/Architecture/verify_magicai_finance_completion.php"
          php "$host/tests/Standalone/FinanceCompletion/run.php"

          set +e
          legacy_output=$(php "$host/tests/Architecture/verify_magicai_workcore_extraction.php" 2>&1)
          legacy_status=$?
          set -e
          test "$legacy_status" -eq 1
          grep -q 'Enabled modules outside aggregate providers are not automatically loaded.' <<<"$legacy_output"
          grep -q '1 failed.' <<<"$legacy_output"
          echo "$legacy_output"

      - name: Commit verified native extension conversion
        run: |
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add -A
          git commit -m 'feat: convert WorkCore into MagicAI-native extensions'
          git pull --rebase origin feature/magicai-native-workcore-extensions
          git push origin HEAD:feature/magicai-native-workcore-extensions
