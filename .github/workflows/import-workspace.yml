name: Import verified WorkCore workspace

on:
  push:
    branches:
      - feature/five-domain-extension-split
    paths:
      - .github/workflows/import-workspace.yml

permissions:
  contents: write

jobs:
  import-workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/five-domain-extension-split
          fetch-depth: 0

      - name: Install Parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow==17.0.0

      - name: Download transfer dataset
        run: |
          curl --fail --location --retry 4 --retry-delay 3 \
            'https://titan-builder-ob009-artifact.miniup.app/api/data-file/titan-builder-ob009-artifact/workcore-workspace-transfer.parquet' \
            --output /tmp/workcore-workspace-transfer.parquet

      - name: Reconstruct and verify archive
        env:
          EXPECTED_SHA256: ced25f6a626b45db3f54b276e78674c3b10158b99ece83ea0a579b30e19a463b
          EXPECTED_BYTES: '2466665'
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          import pyarrow.parquet as pq

          table = pq.read_table('/tmp/workcore-workspace-transfer.parquet')
          rows = sorted(table.to_pylist(), key=lambda row: int(row['Sequence']))
          encoded = ''.join(str(row['Payload_Base64']) for row in rows)
          archive = base64.b64decode(encoded, validate=True)

          expected_sha = os.environ['EXPECTED_SHA256']
          expected_bytes = int(os.environ['EXPECTED_BYTES'])
          actual_sha = hashlib.sha256(archive).hexdigest()

          if len(archive) != expected_bytes:
              raise SystemExit(f'archive size mismatch: {len(archive)} != {expected_bytes}')
          if actual_sha != expected_sha:
              raise SystemExit(f'archive SHA-256 mismatch: {actual_sha} != {expected_sha}')

          Path('/tmp/workcore-extension-workspace.zip').write_bytes(archive)
          print(f'verified {len(archive)} bytes with SHA-256 {actual_sha}')
          PY

      - name: Expand extension workspace
        run: |
          rm -rf /tmp/workcore-expanded
          mkdir -p /tmp/workcore-expanded
          unzip -q /tmp/workcore-extension-workspace.zip -d /tmp/workcore-expanded
          test -d /tmp/workcore-expanded/workcore-extension-workspace/packages
          cp -a /tmp/workcore-expanded/workcore-extension-workspace/packages ./packages
          cp /tmp/workcore-expanded/workcore-extension-workspace/ownership-manifest.json ./ownership-manifest.json

      - name: Record import provenance
        run: |
          cat > IMPORT-PROVENANCE.md <<'EOF'
          # Import provenance

          The expanded extension source was reconstructed by GitHub Actions from the verified WorkCore extension workspace archive.

          - Archive: `workcore-extension-workspace.zip`
          - Archive bytes: `2,466,665`
          - Archive SHA-256: `ced25f6a626b45db3f54b276e78674c3b10158b99ece83ea0a579b30e19a463b`
          - Workspace entries: `2,158`
          - Extension groups: five domain groups plus the shared foundation
          - Source transfer: MiniUp Parquet dataset with ordered Base64 chunks

          The temporary importer removes itself after a successful verified extraction.
          EOF

      - name: Remove one-shot importer
        run: rm -f .github/workflows/import-workspace.yml

      - name: Commit expanded source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md IMPORT-PROVENANCE.md ownership-manifest.json packages .github/workflows/import-workspace.yml
          git commit -m 'feat: import five WorkCore extension groups'
          git push origin HEAD:feature/five-domain-extension-split
