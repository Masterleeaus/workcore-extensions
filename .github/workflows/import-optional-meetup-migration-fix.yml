name: Import optional Meetup migration fix

on:
  push:
    branches:
      - feature/five-domain-extension-split
    paths:
      - .github/workflows/import-optional-meetup-migration-fix.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/import-optional-meetup-migration-fix.yml

permissions:
  contents: write

concurrency:
  group: import-optional-meetup-migration-fix
  cancel-in-progress: false

jobs:
  import-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/five-domain-extension-split
          fetch-depth: 0

      - name: Install Parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow==17.0.0

      - name: Download transfer dataset
        run: |
          curl --fail --location --retry 4 --retry-delay 3 \
            'https://titan-builder-ob009-artifact.miniup.app/api/data-file/titan-builder-ob009-artifact/workcore-meetup-migration-fix-transfer.parquet' \
            --output /tmp/workcore-meetup-migration-fix.parquet

      - name: Reconstruct and verify archive
        env:
          EXPECTED_SHA256: 173a0979a7e61f7a20cb10214bd51fdf8aa34e385e991679230000b2fffce785
          EXPECTED_BYTES: '10848'
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          import pyarrow.parquet as pq

          rows = sorted(
              pq.read_table('/tmp/workcore-meetup-migration-fix.parquet').to_pylist(),
              key=lambda row: int(row['Sequence']),
          )
          archive = base64.b64decode(
              ''.join(str(row['Payload_Base64']) for row in rows),
              validate=True,
          )
          actual_sha = hashlib.sha256(archive).hexdigest()
          if len(archive) != int(os.environ['EXPECTED_BYTES']):
              raise SystemExit(f'archive size mismatch: {len(archive)}')
          if actual_sha != os.environ['EXPECTED_SHA256']:
              raise SystemExit(f'archive SHA-256 mismatch: {actual_sha}')
          Path('/tmp/workcore-meetup-migration-fix.zip').write_bytes(archive)
          print(f'verified {len(archive)} bytes with SHA-256 {actual_sha}')
          PY

      - name: Apply optional donor migration fix
        run: |
          rm -rf /tmp/workcore-meetup-fix-expanded
          mkdir -p /tmp/workcore-meetup-fix-expanded
          unzip -q /tmp/workcore-meetup-migration-fix.zip -d /tmp/workcore-meetup-fix-expanded
          fix=/tmp/workcore-meetup-fix-expanded/workcore-meetup-migration-fix
          test -f "$fix/tools/build_extensions.py"
          test -f "$fix/tests/test_host_compatibility.py"
          test -f "$fix/integration/host-overlay/database/migrations/2026_07_25_000001_add_workcore_tenancy_to_meetup.php"
          cp "$fix/tools/build_extensions.py" tools/build_extensions.py
          cp "$fix/tests/test_host_compatibility.py" tests/test_host_compatibility.py
          cp "$fix/integration/host-overlay/database/migrations/2026_07_25_000001_add_workcore_tenancy_to_meetup.php" integration/host-overlay/database/migrations/

      - name: Verify optional migration fix
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPYCACHEPREFIX: /tmp/workcore-pycache
        run: |
          python -B -m unittest tests/test_repository_integrity.py tests/test_host_compatibility.py -v
          python -B tools/validate_repository.py --repo .
          php -l integration/host-overlay/database/migrations/2026_07_25_000001_add_workcore_tenancy_to_meetup.php

      - name: Commit fix on latest branch head
        run: |
          paths=(
            tools/build_extensions.py
            tests/test_host_compatibility.py
            integration/host-overlay/database/migrations/2026_07_25_000001_add_workcore_tenancy_to_meetup.php
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo 'Optional Meetup migration fix is already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          git commit -m 'fix: guard optional Meetup donor migrations'
          git fetch origin feature/five-domain-extension-split
          git merge --no-edit origin/feature/five-domain-extension-split
          git push origin HEAD:feature/five-domain-extension-split
