name: Import SQLite migration portability fix

on:
  push:
    branches:
      - feature/five-domain-extension-split
    paths:
      - .github/workflows/import-sqlite-migration-fix.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/import-sqlite-migration-fix.yml

permissions:
  contents: write

jobs:
  import-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/five-domain-extension-split
          fetch-depth: 0

      - name: Install Parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow==17.0.0

      - name: Download transfer dataset
        run: |
          curl --fail --location --retry 4 --retry-delay 3 \
            'https://titan-builder-ob009-artifact.miniup.app/api/data-file/titan-builder-ob009-artifact/workcore-sqlite-migration-fix-transfer.parquet' \
            --output /tmp/workcore-sqlite-migration-fix.parquet

      - name: Reconstruct and verify archive
        env:
          EXPECTED_SHA256: 5d7ab51aaeb75cc53347d63f8e54c9473d49306c0c1b18138ca23fd19b24e20e
          EXPECTED_BYTES: '172341'
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          import pyarrow.parquet as pq

          rows = sorted(
              pq.read_table('/tmp/workcore-sqlite-migration-fix.parquet').to_pylist(),
              key=lambda row: int(row['Sequence']),
          )
          archive = base64.b64decode(
              ''.join(str(row['Payload_Base64']) for row in rows),
              validate=True,
          )
          actual_sha = hashlib.sha256(archive).hexdigest()
          if len(archive) != int(os.environ['EXPECTED_BYTES']):
              raise SystemExit(f'archive size mismatch: {len(archive)}')
          if actual_sha != os.environ['EXPECTED_SHA256']:
              raise SystemExit(f'archive SHA-256 mismatch: {actual_sha}')
          Path('/tmp/workcore-sqlite-migration-fix.zip').write_bytes(archive)
          print(f'verified {len(archive)} bytes with SHA-256 {actual_sha}')
          PY

      - name: Apply migration fix
        run: |
          rm -rf /tmp/workcore-sqlite-fix-expanded
          mkdir -p /tmp/workcore-sqlite-fix-expanded
          unzip -q /tmp/workcore-sqlite-migration-fix.zip -d /tmp/workcore-sqlite-fix-expanded
          fix=/tmp/workcore-sqlite-fix-expanded/workcore-sqlite-migration-fix
          test -f "$fix/tools/build_extensions.py"
          test -f "$fix/ownership-manifest.json"
          cp "$fix/tools/build_extensions.py" tools/build_extensions.py
          cp "$fix/tests/test_build_extensions.py" tests/test_build_extensions.py
          cp "$fix/tests/test_host_compatibility.py" tests/test_host_compatibility.py
          cp "$fix/packages/workcore-shared-foundation/files.sha256.json" packages/workcore-shared-foundation/files.sha256.json
          cp "$fix/packages/workcore-shared-foundation/src/Domains/WorkCore/Database/Migrations/2026_07_23_120058_create_tz_ai_knowledge_tables.php" packages/workcore-shared-foundation/src/Domains/WorkCore/Database/Migrations/
          cp "$fix/ownership-manifest.json" ownership-manifest.json

      - name: Verify migration fix
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPYCACHEPREFIX: /tmp/workcore-pycache
        run: |
          python -B -m unittest tests/test_repository_integrity.py tests/test_host_compatibility.py -v
          python -B tools/validate_repository.py --repo .
          php -l packages/workcore-shared-foundation/src/Domains/WorkCore/Database/Migrations/2026_07_23_120058_create_tz_ai_knowledge_tables.php

      - name: Commit migration fix on latest branch head
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/build_extensions.py tests/test_build_extensions.py tests/test_host_compatibility.py ownership-manifest.json packages/workcore-shared-foundation/files.sha256.json packages/workcore-shared-foundation/src/Domains/WorkCore/Database/Migrations/2026_07_23_120058_create_tz_ai_knowledge_tables.php
          git commit -m 'fix: guard full-text migration on SQLite'
          git fetch origin feature/five-domain-extension-split
          git merge --no-edit origin/feature/five-domain-extension-split
          git push origin HEAD:feature/five-domain-extension-split
